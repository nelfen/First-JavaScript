<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>domQueryTest</title>
  </head>
  <body>
    <p class="text">첫 번째 문장입니다.</p>
    <p class="text">두 번째 문장입니다.</p>
    <button onclick="highlight()">스타일 변경</button>

    <script>
      function highlight() {
        var firstText = document.querySelector(".text");
        firstText.style.color = "red";
        firstText.style.fontWeight = "bold";

        var allTexts = document.querySelectorAll(".text");
        allTexts[1].style.color = "green";
      }
    </script>
  </body>
</html>
