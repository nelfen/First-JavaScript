<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>switchTest</title>
  </head>
  <body>
    <script>
      var site = prompt("접속할 포털 사이트를 선택하세요 (naver, google, daum)", "naver");
      var url;

      switch (site) {
        case "naver":
          url = "https://www.naver.com";
          break;
        case "google":
          url = "https://www.google.com";
          break;
        case "daum":
          url = "https://www.daum.net";
          break;
        default:
          alert("보기 중에 없는 사이트입니다.");
      }

      if (url) {
        document.write("<a href='" + url + "' target='_blank'>" + site + " 바로가기</a>");
      }
    </script>
  </body>
</html>
