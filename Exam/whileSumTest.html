<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>whileSumTest</title>
  </head>
  <body>
    <script>
      var sum = 0;
      var i = 1;

      while (i <= 10) {
        sum += i;
        i++;
      }

      document.write("1부터 10까지의 합: " + sum + "<br>");
    </script>
  </body>
</html>
