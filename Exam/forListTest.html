<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>forListTest</title>
  </head>
  <body>
    <script>
      var list = "<ol>";

      for (var i = 1; i <= 5; i++) {
        list += "<li>목록 항목 " + i + "</li>";
      }

      list += "</ol>";

      console.log(list);
      document.write(list);
    </script>
  </body>
</html>
