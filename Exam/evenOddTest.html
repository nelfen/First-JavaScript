<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>evenOddTest</title>
  </head>
  <body>
    <script>
      var inputNum = prompt("숫자를 입력하세요", "0");
      var result = inputNum % 2 === 0 ? "짝수입니다." : "홀수입니다.";

      document.write("입력한 숫자: " + inputNum + "<br>");
      document.write("결과: " + result + "<br>");
    </script>
  </body>
</html>
