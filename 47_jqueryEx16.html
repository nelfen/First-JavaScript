<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <script src="jquery-1.12.4.min.js"></script>
    <title>jqueryEx16</title>
  </head>
  <body>
    <script>
      $(function () {
        $("#box").children("p").css({ color: "orange" });

        $("#box").find(".target").css({ "background-color": "#0ff" });
      });
    </script>
    <h1>트리 탐색 - 자식 및 하위 검색</h1>
    <div id="box">
      <p>직계 자식 단락 1</p>
      <div>
        <p class="target">깊숙이 숨은 하위 단락 2</p>
      </div>
      <p>직계 자식 단락 3</p>
    </div>
  </body>
</html>
