<html lang="ko">

      $(function () {
        $("a[href='https://google.com']").css({ color: "red" });

        $("a[href*='nate']").css({ "background-color": "#0ff" });
      });
    </script>
    <h1>속성 선택자 - 값 비교</h1>
    <p><a href="https://google.com">구글 바로가기</a></p>

  </body>
</html>
