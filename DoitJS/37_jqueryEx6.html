<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="JS/jquery-1.12.4.min.js"></script>
    <title>jqueryEx6</title>
  </head>
  <body>
    <script>
      $(function () {
        $("#list2 li").slice(1, 3).css({ "background-color": "#0ff" });

        $("#list2 li:has(span)").css({ border: "2px solid #f00" });
      });
    </script>
    <h1>탐색 선택자 - 슬라이스 및 포함 여부</h1>
    <ul id="list2">
      <li>내용1</li>
      <li>내용2 <span>(스팬 포함)</span></li>
      <li>내용3</li>
      <li>내용4</li>
    </ul>
  </body>
</html>
