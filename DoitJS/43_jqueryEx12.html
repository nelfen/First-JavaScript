      });
    </script>
    <h1>폼 선택자 - 체크 상태</h1>
    <form>
      <label
        ><input type="checkbox" name="hobby" value="game" checked /> 게임</label
      >
      <label><input type="checkbox" name="hobby" value="movie" /> 영화</label>
    </form>
  </body>
